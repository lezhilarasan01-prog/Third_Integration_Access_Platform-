name: Build and Deploy to AWS EC2

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Verify Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        working-directory: ./frontend
        run: |
          npm ci --prefer-offline --no-audit || npm install
          npm run build

      - name: Build Spring Boot Application
        run: mvn clean package -DskipTests -B

  deploy-to-ec2:
    name: Deploy to AWS EC2 via SSH
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Check Deployment Secrets
        id: check-secrets
        run: |
          if [ -z "${{ secrets.EC2_HOST }}" ]; then
            echo "::notice ::EC2_HOST secret not configured. Skipping remote SSH deployment."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Execute Remote Deployment via SSH
        if: steps.check-secrets.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo ">> Deploying latest release on EC2..."
            
            # Navigate to project directory (~/app or ~/erp-kafka-platform) or clone if not present
            TARGET_DIR=""
            if [ -d ~/app ]; then
              TARGET_DIR=~/app
            elif [ -d ~/erp-kafka-platform ]; then
              TARGET_DIR=~/erp-kafka-platform
            else
              git clone https://github.com/${{ github.repository }}.git ~/app
              TARGET_DIR=~/app
            fi
            
            cd "$TARGET_DIR"
            git fetch --all
            git reset --hard origin/main
            
            # Build and launch with Docker Compose
            echo ">> Starting Docker containers..."
            docker compose down || true
            docker compose build --no-cache
            docker compose up -d
            
            # Health check verification
            echo ">> Verifying health check on port 8080..."
            sleep 15
            for i in {1..30}; do
              if curl -s http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
                echo ">> SUCCESS: Application is healthy on EC2!"
                docker ps --filter "name=erp-integration-platform"
                exit 0
              fi
              echo "   Waiting for health check ($i/30)..."
              sleep 3
            done
            
            echo ">> Health check failed. Dumping logs:"
            docker logs erp-integration-platform --tail 50
            exit 1
