# ===================================================================
# Logging Levels (Kafka set to WARN to prevent noise)
# ===================================================================
logging.level.root=INFO
logging.level.com.platform.erp=DEBUG
logging.level.org.apache.kafka=OFF
logging.level.org.springframework.kafka=OFF
