# ===================================================================
# Server Configuration
# ===================================================================
server.port=${SERVER_PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s

# ===================================================================
# Spring Application & PostgreSQL Datasource
# ===================================================================
spring.application.name=erp-kafka-platform
spring.config.import=optional:file:.env[.properties]

# ===================================================================
# Java 21 High-Throughput Virtual Threads (Project Loom)
# ===================================================================
spring.threads.virtual.enabled=true


spring.datasource.url=${DB_URL:jdbc:postgresql://15.207.237.212:5432/erp_db?tcpKeepAlive=true&reWriteBatchedInserts=true}
spring.datasource.username=${DB_USER:erp_admin}
spring.datasource.password=${DB_PASSWORD:ErpPostgres2026!}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=580000
spring.datasource.hikari.idle-timeout=280000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.validation-timeout=3000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# ===================================================================
# File Upload Limits (500 MB)
# ===================================================================
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# ===================================================================
# Apache Kafka (SASL SCRAM-SHA-512 Security)
# ===================================================================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:15.207.237.212:9092}
spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:SASL_PLAINTEXT}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:SCRAM-SHA-512}
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="${KAFKA_USER:erp_user}" password="${KAFKA_PASSWORD:ErpKafkaSecure2026!}";

# Kafka Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.ByteArraySerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=5
spring.kafka.producer.batch-size=65536
spring.kafka.producer.buffer-memory=67108864
spring.kafka.producer.compression-type=${KAFKA_COMPRESSION_TYPE:lz4}
spring.kafka.producer.properties.linger.ms=10
spring.kafka.producer.properties.max.request.size=10485760
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.enable.idempotence=true

# Kafka Consumer & Listener
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:erp-conversion-group}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.max-poll-records=50
spring.kafka.consumer.properties.max.partition.fetch.bytes=10485760
spring.kafka.consumer.properties.fetch.max.wait.ms=500
spring.kafka.listener.ack-mode=manual_immediate
spring.kafka.listener.concurrency=6

# ===================================================================
# Platform Storage & S3 Claim-Check
# ===================================================================
platform.storage.inline-threshold-bytes=${INLINE_THRESHOLD_BYTES:5242880}
platform.storage.storage-type=S3
platform.storage.s3-bucket=${AWS_S3_BUCKET:erp-integration-blobs}
platform.storage.s3-region=${AWS_REGION:ap-south-1}
platform.storage.s3-access-key=${AWS_ACCESS_KEY_ID:}
platform.storage.s3-secret-key=${AWS_SECRET_ACCESS_KEY:}
platform.storage.presigned-url-duration-minutes=${S3_PRESIGNED_MINUTES:15}

# ===================================================================
# Apache Kafka Topics & Dedicated 1-to-1 DLQ Mappings
# Each ingestion topic has its own dedicated Dead Letter Queue (DLQ)
# ===================================================================
platform.kafka.topics.po-raw=${TOPIC_PO_RAW:erp_file_po_raw}
platform.kafka.topics.po-dlq=${TOPIC_PO_DLQ:erp_file_po_dlq}
platform.kafka.topics.asn-raw=${TOPIC_ASN_RAW:erp_file_asn_raw}
platform.kafka.topics.asn-dlq=${TOPIC_ASN_DLQ:erp_file_asn_dlq}
platform.kafka.topics.item-raw=${TOPIC_ITEM_RAW:erp_file_item_raw}
platform.kafka.topics.item-dlq=${TOPIC_ITEM_DLQ:erp_file_item_dlq}
platform.kafka.topics.do-raw=${TOPIC_DO_RAW:erp_file_do_raw}
platform.kafka.topics.do-dlq=${TOPIC_DO_DLQ:erp_file_do_dlq}
platform.kafka.topics.batch-raw=${TOPIC_BATCH_RAW:erp_file_batch_raw}
platform.kafka.topics.batch-dlq=${TOPIC_BATCH_DLQ:erp_file_batch_dlq}

# Consumer topic pattern (subscribes to all raw ingestion topics)
platform.kafka.consumer.topic-pattern=${KAFKA_TOPIC_PATTERN:.*_raw}

