version: '3.8'

services:
  erp-platform:
    container_name: erp-integration-platform
    build:
      context: .
      dockerfile: Dockerfile
    image: erp-integration-platform:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - DB_URL=jdbc:postgresql://${EC2_HOST:-15.207.237.212}:5432/erp_db
      - DB_USER=${DB_USER:-erp_admin}
      - DB_PASSWORD=${DB_PASSWORD:-ErpPostgres2026!}
      - KAFKA_BOOTSTRAP_SERVERS=${EC2_HOST:-15.207.237.212}:9092
      - KAFKA_SECURITY_PROTOCOL=SASL_PLAINTEXT
      - KAFKA_SASL_MECHANISM=SCRAM-SHA-512
      - KAFKA_USER=${KAFKA_USER:-erp_user}
      - KAFKA_PASSWORD=${KAFKA_PASSWORD:-ErpKafkaSecure2026!}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-erp-integration-blobs}
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - INLINE_THRESHOLD_BYTES=5242880
      - MAWM_ENABLED=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
